apiVersion: v1
kind: Secret
metadata:
  name: users-api-secret
  labels:
    app: users-api
type: Opaque
stringData:
  # Sensitive configuration. Replace values before deploying to a real environment.
  ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=fcg_users;Username=postgres;Password=postgres"
  # Must match CatalogAPI's Jwt:SecretKey so the token issued here is accepted there.
  Settings__Jwt__SigningKey: "CHANGE_ME_super_secret_shared_key_min_32_chars_long!!"
  # Senha do admin semeado no startup (sensível).
  Settings__Seed__AdminPassword: "Admin@123"
  RabbitMq__Username: "guest"
  RabbitMq__Password: "guest"
